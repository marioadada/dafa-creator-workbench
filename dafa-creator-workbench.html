<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大发 · 创作工作台</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #3b82f6;
      --primary-soft: #dbeafe;
      --accent: #f97316;
      --accent-light: #ffedd5;
      --accent-dark: #c2410c;
      --bg: #f1f5f9;
      --surface: #ffffff;
      --text: #0f172a;
      --text-secondary: #475569;
      --text-tertiary: #94a3b8;
      --border: #e2e8f0;
      --success: #10b981;
      --success-soft: #d1fae5;
      --warning: #f59e0b;
      --warning-soft: #fef3c7;
      --danger: #ef4444;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.05);
      --radius: 14px;
      --radius-sm: 8px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .app { display: flex; height: 100vh; overflow: hidden; }
    .sidebar {
      width: 270px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .brand {
      padding: 22px 20px 18px;
      border-bottom: 1px solid var(--border);
    }
    .brand-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: -0.5px;
    }
    .brand-title .logo {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      border-radius: 10px;
      display: grid; place-items: center;
      color: #fff; font-size: 18px;
    }
    .brand-sub { font-size: 12px; color: var(--text-tertiary); margin-top: 4px; padding-left: 44px; }
    .nav { flex: 1; overflow-y: auto; padding: 12px 10px; }
    .nav-group { margin-bottom: 18px; }
    .nav-label {
      font-size: 11px; font-weight: 700;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 0 12px 8px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 11px;
      padding: 10px 12px;
      margin: 2px 0;
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      transition: all 0.15s ease;
      position: relative;
    }
    .nav-item:hover { background: #f8fafc; color: var(--text); }
    .nav-item.active {
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 700;
    }
    .nav-item.active::before {
      content: ''; position: absolute; left: 0; top: 8px; bottom: 8px;
      width: 3px; background: var(--primary); border-radius: 0 3px 3px 0;
    }
    .nav-icon { font-size: 17px; width: 22px; text-align: center; }
    .nav-badge {
      margin-left: auto;
      background: var(--accent-light);
      color: var(--accent-dark);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 20px;
    }
    .sidebar-footer {
      padding: 14px;
      border-top: 1px solid var(--border);
      display: flex; gap: 8px;
    }
    .sidebar-footer button {
      flex: 1;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: var(--radius-sm);
      padding: 8px 0;
      font-size: 12px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
    }
    .sidebar-footer button:hover { border-color: var(--primary-light); color: var(--primary); }

    .main { flex: 1; overflow-y: auto; min-width: 0; }
    .header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(241,245,249,0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 18px 28px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-left h1 { margin: 0; font-size: 22px; font-weight: 800; color: var(--text); }
    .header-left .meta { font-size: 13px; color: var(--text-secondary); margin-top: 3px; }
    .header-actions { display: flex; gap: 10px; align-items: center; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      border: none; border-radius: var(--radius-sm);
      padding: 9px 15px;
      font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: #172554; transform: translateY(-1px); }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-accent:hover { background: var(--accent-dark); transform: translateY(-1px); }
    .btn-ghost { background: #fff; color: var(--text-secondary); border: 1px solid var(--border); }
    .btn-ghost:hover { border-color: var(--primary-light); color: var(--primary); }
    .btn-sm { padding: 6px 11px; font-size: 12px; }

    .content { padding: 24px 28px 40px; max-width: 1100px; }

    .hero-card {
      background: linear-gradient(135deg, var(--primary) 0%, #312e81 100%);
      color: #fff;
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-lg);
      display: flex; justify-content: space-between; align-items: center;
    }
    .hero-card h2 { margin: 0 0 6px; font-size: 20px; }
    .hero-card p { margin: 0; opacity: 0.85; font-size: 14px; }
    .hero-stats { display: flex; gap: 28px; }
    .hero-stat { text-align: center; }
    .hero-stat .num { font-size: 26px; font-weight: 800; }
    .hero-stat .label { font-size: 12px; opacity: 0.75; }

    .tabs {
      display: flex; gap: 8px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 2px;
    }
    .tab {
      padding: 9px 16px;
      font-size: 14px; font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all 0.15s;
    }
    .tab:hover { color: var(--primary); }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); }

    .card-grid { display: grid; gap: 16px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
    .card-title { font-size: 16px; font-weight: 700; color: var(--text); margin: 0; line-height: 1.4; }
    .card-title a { color: inherit; text-decoration: none; }
    .card-title a:hover { color: var(--primary-light); text-decoration: underline; }
    .card-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag {
      font-size: 11px; font-weight: 700;
      padding: 3px 8px; border-radius: 20px;
    }
    .tag-blue { background: var(--primary-soft); color: var(--primary); }
    .tag-orange { background: var(--accent-light); color: var(--accent-dark); }
    .tag-green { background: var(--success-soft); color: #047857; }
    .tag-yellow { background: var(--warning-soft); color: #92400e; }
    .tag-gray { background: #f1f5f9; color: var(--text-secondary); }
    .tag-red { background: #fee2e2; color: #b91c1c; }
    .card-body { font-size: 14px; color: var(--text-secondary); margin-bottom: 14px; }
    .card-body p { margin: 0 0 8px; }
    .card-body p:last-child { margin-bottom: 0; }
    .card-meta { font-size: 12px; color: var(--text-tertiary); margin-bottom: 14px; display: flex; gap: 14px; flex-wrap: wrap; }
    .card-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .card-actions .btn { padding: 6px 12px; font-size: 12px; }

    .empty-state {
      text-align: center; padding: 50px 20px; color: var(--text-tertiary);
    }
    .empty-state .icon { font-size: 42px; margin-bottom: 12px; }
    .empty-state h3 { margin: 0 0 6px; color: var(--text); font-size: 16px; }

    .task-list { display: flex; flex-direction: column; gap: 10px; }
    .task-item {
      display: flex; align-items: center; gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 13px 16px;
    }
    .task-item.done .task-text { text-decoration: line-through; color: var(--text-tertiary); }
    .task-check {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-radius: 5px;
      cursor: pointer;
      display: grid; place-items: center;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .task-check:hover { border-color: var(--primary-light); }
    .task-check.checked { background: var(--success); border-color: var(--success); color: #fff; }
    .task-text { flex: 1; font-size: 14px; }
    .task-delete { color: var(--text-tertiary); cursor: pointer; font-size: 16px; }
    .task-delete:hover { color: var(--danger); }
    .add-task {
      display: flex; gap: 10px; margin-top: 16px;
    }
    .add-task input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 14px;
      outline: none;
    }
    .add-task input:focus { border-color: var(--primary-light); }

    .progress-bar {
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 6px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary-light), var(--accent));
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .input, .textarea, select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 11px 14px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }
    .input:focus, .textarea:focus, select:focus { border-color: var(--primary-light); }
    .textarea { min-height: 120px; resize: vertical; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary); }

    .video-card {
      display: flex; gap: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .video-thumb {
      width: 180px; height: 100px;
      background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
      border-radius: var(--radius-sm);
      display: grid; place-items: center;
      color: #fff; font-size: 28px;
      flex-shrink: 0;
      position: relative;
    }
    .video-duration {
      position: absolute; bottom: 6px; right: 6px;
      background: rgba(0,0,0,0.7); color: #fff;
      font-size: 11px; font-weight: 700;
      padding: 2px 6px; border-radius: 4px;
    }
    .video-info { flex: 1; min-width: 0; }
    .video-info h4 { margin: 0 0 6px; font-size: 15px; }
    .video-info p { margin: 0 0 10px; font-size: 13px; color: var(--text-secondary); }

    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--text); color: #fff;
      padding: 12px 18px; border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 600;
      box-shadow: var(--shadow-lg);
      transform: translateY(100px); opacity: 0;
      transition: all 0.25s ease;
      z-index: 100;
    }
    .toast.show { transform: translateY(0); opacity: 1; }

    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(15,23,42,0.5);
      display: none; place-items: center;
      z-index: 50;
    }
    .modal-overlay.show { display: grid; }
    .modal {
      background: var(--surface);
      border-radius: var(--radius);
      width: 90%; max-width: 500px;
      max-height: 80vh; overflow-y: auto;
      padding: 22px;
      box-shadow: var(--shadow-lg);
    }
    .modal h3 { margin: 0 0 16px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

    .note-list { display: flex; flex-direction: column; gap: 10px; }
    .note-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 13px 16px;
      display: flex; justify-content: space-between; gap: 12px;
    }
    .note-text { font-size: 14px; flex: 1; }
    .note-time { font-size: 11px; color: var(--text-tertiary); white-space: nowrap; }

    .random-pick {
      background: var(--accent-light);
      border: 2px dashed var(--accent);
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
      margin-bottom: 20px;
    }
    .random-pick h3 { margin: 0 0 8px; color: var(--accent-dark); }
    .random-pick p { margin: 0 0 16px; color: var(--text-secondary); font-size: 14px; }

    .section-title {
      font-size: 15px; font-weight: 800; color: var(--text);
      margin: 0 0 14px; display: flex; align-items: center; gap: 8px;
    }

    @media (max-width: 900px) {
      .sidebar { width: 70px; }
      .brand-title span:not(.logo), .brand-sub, .nav-label, .nav-text { display: none; }
      .nav-item { justify-content: center; padding: 12px 0; }
      .nav-icon { width: auto; }
      .sidebar-footer { flex-direction: column; padding: 10px; }
      .hero-card { flex-direction: column; align-items: flex-start; gap: 18px; }
      .video-card { flex-direction: column; }
      .video-thumb { width: 100%; height: 160px; }
    }
    .pain-voices { background: #f8f9fb; border-left: 3px solid #f0a020; border-radius: 6px; padding: 8px 10px; }
    .pain-voice { font-size: 12.5px; line-height: 1.65; color: #444; padding: 4px 0; }
    .pain-voice + .pain-voice { border-top: 1px dashed #e2e5ea; }
    .pain-like { display: inline-block; background: #ffe9c7; color: #a05a00; border-radius: 4px; padding: 0 5px; font-size: 11px; margin-right: 5px; font-weight: 600; }
    .pain-text { color: #333; }
    .pain-from { color: #999; font-size: 11px; margin-left: 4px; }
    .pain-outline { margin-top: 8px; font-size: 13px; }
    .pain-outline summary { cursor: pointer; color: #d97706; font-weight: 600; outline: none; }
    .pain-outline ol { margin: 8px 0 0; padding-left: 20px; color: #555; line-height: 1.8; }
    .history-bar { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; color: var(--text-secondary); flex-wrap: wrap; }
    .history-bar label { font-weight: 600; }
    .history-bar select { padding: 5px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: #fff; font-size: 13px; color: var(--text); cursor: pointer; }
    .history-hint { color: var(--warning); font-weight: 600; }
    .en-lesson-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    .en-sentence { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px dashed var(--border); }
    .en-sentence:last-child { border-bottom: none; }
    .en-check { flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--primary-light); display: grid; place-items: center; cursor: pointer; font-weight: 700; color: var(--primary); background: #fff; transition: all .15s; }
    .en-check.done { background: var(--primary); color: #fff; border-color: var(--primary); }
    .en-sentence-body { flex: 1; }
    .en-en { font-size: 16px; font-weight: 600; color: var(--text); }
    .en-cn { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
    .en-note { font-size: 12px; color: var(--text-tertiary); margin-top: 3px; }
    .en-words { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-top: 8px; }
    .en-word { background: var(--primary-soft); border-radius: var(--radius-sm); padding: 10px 12px; }
    .en-word .w-en { font-weight: 700; color: var(--primary); }
    .en-word .w-ph { font-size: 12px; color: var(--text-tertiary); font-style: italic; }
    .en-word .w-cn { font-size: 13px; color: var(--text-secondary); }
    .en-tips { margin: 0; padding-left: 20px; }
    .en-tips li { margin: 6px 0; color: var(--text-secondary); }
    .lesson-select { padding: 5px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; background: #fff; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-title"><span class="logo">⚡</span><span>大发工作台</span></div>
        <div class="brand-sub">创作 · 复盘 · 跟练</div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-footer">
        <button onclick="exportData()">导出备份</button>
        <button onclick="document.getElementById('importFile').click()">导入备份</button>
        <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
      </div>
    </aside>

    <main class="main">
      <header class="header">
        <div class="header-left">
          <h1 id="pageTitle">每日计划</h1>
          <div class="meta" id="pageMeta">今天是 <span id="todayDate"></span> · 最后更新：<span id="lastUpdate">2026-10-25 14:56</span></div>
          <div class="history-bar" id="historyBar">
            <label for="historySelect">📅 历史数据：</label>
            <select id="historySelect" onchange="changeHistory(this.value)"></select>
            <span id="historyHint" class="history-hint"></span>
          </div>
        </div>
        <div class="header-actions">
          <button class="btn btn-ghost" onclick="showRefreshInfo()">🔄 联网刷新</button>
          <button class="btn btn-ghost" onclick="exportExcel()">📤 导出Excel</button>
          <button class="btn btn-primary" onclick="openAddTaskModal()">+ 新建任务</button>
        </div>
      </header>
      <div class="content" id="content"></div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-overlay" id="addTaskModal">
    <div class="modal">
      <h3>加入每日任务</h3>
      <div class="form-group">
        <label>任务内容</label>
        <input type="text" class="input" id="modalTaskInput" placeholder="输入任务...">
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="confirmAddTask()">确认添加</button>
      </div>
    </div>
  </div>

  <script>

    const LS_KEYS = {
      tasks: 'dafa_tasks',
      notes: 'dafa_notes',
      sports: 'dafa_sports',

      english: 'dafa_english',
      currentTab: 'dafa_current_tab',
      subTab: 'dafa_sub_tab'
    };

    function load(key, def) {
      try { return JSON.parse(localStorage.getItem(key)) || def; }
      catch { return def; }
    }
    function save(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

    let state = {
      current: load(LS_KEYS.currentTab, 'plan'),
      subTab: load(LS_KEYS.subTab, {}),
      tasks: load(LS_KEYS.tasks, []),
      notes: load(LS_KEYS.notes, []),
      sports: load(LS_KEYS.sports, []),
      reviews: load(LS_KEYS.reviews, []),
      englishProgress: load(LS_KEYS.english, {})
    };

    const MODULES = [
      { id: 'plan', icon: '📋', label: '每日计划', group: '核心' },
      { id: 'aiCoding', icon: '🤖', label: 'AI编程社', group: '公众号', badge: '2' },
      { id: 'opc', icon: '📱', label: '大发AI OPC手机', group: '公众号', badge: '2' },
      { id: 'novel', icon: '📚', label: '短篇小说热门赛道', group: '创作' },
      { id: 'hot', icon: '🔥', label: '爆款热点视频/二创', group: '创作' },
      { id: 'finance', icon: '📈', label: '财经快讯', group: '财经' },
      { id: 'english', icon: '🎧', label: '英语跟练', group: '提升' },
      { id: 'sport', icon: '🏃', label: '运动记录', group: '生活' },
      { id: 'dailySport', icon: '🎯', label: '每日运动', group: '生活' },
      { id: 'memo', icon: '📝', label: '备忘录', group: '工具' },
      { id: 'review', icon: '📊', label: '内容复盘', group: '工具' }
    ];

    function markListened(title) {
      state.englishProgress[title] = (state.englishProgress[title] || 0) + 1;
      save(LS_KEYS.english, state.englishProgress);
      renderPage();
      toast('已记录跟练 +1');
    }

    function init() {
      renderNav();
      document.getElementById('todayDate').textContent = new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
      renderHistorySelect();
      renderPage();
    }

    function renderNav() {
      const nav = document.getElementById('nav');
      const groups = {};
      MODULES.forEach(m => {
        if (!groups[m.group]) groups[m.group] = [];
        groups[m.group].push(m);
      });
      nav.innerHTML = Object.entries(groups).map(([name, items]) => `
        <div class="nav-group">
          <div class="nav-label">${name}</div>
          ${items.map(m => `
            <div class="nav-item ${state.current === m.id ? 'active' : ''}" onclick="switchModule('${m.id}')">
              <span class="nav-icon">${m.icon}</span>
              <span class="nav-text">${m.label}</span>
              ${m.badge ? `<span class="nav-badge">${m.badge}</span>` : ''}
            </div>
          `).join('')}
        </div>
      `).join('');
    }

    function switchModule(id) {
      state.current = id;
      save(LS_KEYS.currentTab, id);
      renderNav();
      renderPage();
    }

    function renderPage() {
      const mod = MODULES.find(m => m.id === state.current);
      document.getElementById('pageTitle').textContent = mod ? mod.label : '每日计划';
      const content = document.getElementById('content');
      switch (state.current) {
        case 'plan': renderPlan(content); break;
        case 'aiCoding': renderAiCoding(content); break;
        case 'opc': renderOpc(content); break;
        case 'novel': renderNovel(content); break;
        case 'hot': renderHot(content); break;
        case 'finance': renderFinance(content); break;
        case 'english': renderEnglish(content); break;
        case 'sport': renderSport(content); break;
        case 'dailySport': renderDailySport(content); break;
        case 'memo': renderMemo(content); break;
        case 'review': renderReview(content); break;
        default: renderPlan(content);
      }
    }

    // ================== 历史数据视图 ==================
    function getViewData() {
      if (state.viewDate && state.viewDate !== '__live__') {
        const snap = (DATA_HISTORY || []).find(h => h.date === state.viewDate);
        if (snap && snap.data) return Object.assign({}, DATA, snap.data);
      }
      return DATA;
    }
    function renderHistorySelect() {
      const sel = document.getElementById('historySelect');
      if (!sel) return;
      const lu = document.getElementById('lastUpdate');
      const liveLabel = '最新（' + (lu ? lu.textContent : '今天') + '）';
      const hist = DATA_HISTORY || [];
      const opts = ['<option value="__live__">' + liveLabel + '</option>'];
      hist.slice().reverse().forEach(h => opts.push('<option value="' + h.date + '">📜 ' + h.date + '（历史快照）</option>'));
      sel.innerHTML = opts.join('');
      sel.value = (state.viewDate && state.viewDate !== '__live__') ? state.viewDate : '__live__';
      const hint = document.getElementById('historyHint');
      if (hint) hint.textContent = (state.viewDate && state.viewDate !== '__live__') ? '只读 · 回看当天联网数据' : '';
    }
    function changeHistory(v) {
      state.viewDate = v;
      renderHistorySelect();
      renderPage();
    }

    // ================== 每日计划 ==================
    function renderPlan(container) {
      const done = state.tasks.filter(t => t.done).length;
      const total = state.tasks.length;
      const pct = total ? Math.round(done / total * 100) : 0;
      container.innerHTML = `
        <div class="hero-card">
          <div>
            <h2>今日待办</h2>
            <p>把大目标拆成小任务，完成一个勾一个。</p>
          </div>
          <div class="hero-stats">
            <div class="hero-stat"><div class="num">${done}</div><div class="label">已完成</div></div>
            <div class="hero-stat"><div class="num">${total - done}</div><div class="label">待完成</div></div>
            <div class="hero-stat"><div class="num">${pct}%</div><div class="label">进度</div></div>
          </div>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div style="margin:24px 0 10px;font-size:14px;color:var(--text-secondary);">共 ${total} 项任务</div>
        <div class="task-list">
          ${state.tasks.length ? state.tasks.map((t, i) => `
            <div class="task-item ${t.done ? 'done' : ''}">
              <div class="task-check ${t.done ? 'checked' : ''}" onclick="toggleTask(${i})">${t.done ? '✓' : ''}</div>
              <div class="task-text">${escapeHtml(t.text)}</div>
              <div class="task-delete" onclick="deleteTask(${i})">×</div>
            </div>
          `).join('') : '<div class="empty-state"><div class="icon">📋</div><h3>今天还没任务</h3><p>点右上角「新建任务」或从其他模块「加入任务」</p></div>'}
        </div>
        <div class="add-task">
          <input type="text" id="taskInput" placeholder="输入新任务，按回车添加" onkeypress="if(event.key==='Enter') addTaskFromInput()">
          <button class="btn btn-primary" onclick="addTaskFromInput()">添加</button>
        </div>
      `;
    }

    function toggleTask(i) {
      state.tasks[i].done = !state.tasks[i].done;
      save(LS_KEYS.tasks, state.tasks);
      renderPage();
    }
    function deleteTask(i) {
      state.tasks.splice(i, 1);
      save(LS_KEYS.tasks, state.tasks);
      renderPage();
    }
    function addTaskFromInput() {
      const input = document.getElementById('taskInput');
      if (!input) return;
      const text = input.value.trim();
      if (!text) return;
      state.tasks.push({ text, done: false, created: Date.now() });
      save(LS_KEYS.tasks, state.tasks);
      renderPage();
    }
    function openAddTaskModal(text = '') {
      document.getElementById('modalTaskInput').value = text;
      document.getElementById('addTaskModal').classList.add('show');
      setTimeout(() => document.getElementById('modalTaskInput').focus(), 50);
    }
    function closeModal() { document.getElementById('addTaskModal').classList.remove('show'); }
    function confirmAddTask() {
      const input = document.getElementById('modalTaskInput');
      const text = input.value.trim();
      if (!text) return;
      state.tasks.push({ text, done: false, created: Date.now() });
      save(LS_KEYS.tasks, state.tasks);
      closeModal();
      if (state.current !== 'plan') switchModule('plan');
      else renderPage();
      toast('已加入每日任务');
    }

      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function renderEnglish(container) {
      const SRC = getViewData();
      const lessons = (SRC.english && SRC.english.length) ? SRC.english : [];
      const today = localToday();
      // 默认选中：最新已解锁课；用户手动选过且仍解锁则尊重
      let idx = 0;
      if (state.englishLesson != null && lessons[state.englishLesson] && lessons[state.englishLesson].date <= today) {
        idx = state.englishLesson;
      } else {
        for (let i = lessons.length - 1; i >= 0; i--) { if (lessons[i].date <= today) { idx = i; break; } }
      }
      const lesson = lessons[idx];
      if (!lesson) {
        container.innerHTML = '<div class="empty-state"><div class="icon">🎧</div><h3>课程尚未开始</h3><p>第一天的课程准备好后会出现在这里。</p></div>';
        return;
      }
      const readOnly = state.viewDate && state.viewDate !== '__live__';
      const locked = lesson.date > today && !readOnly;
      const doneCount = lesson.sentences.filter((s, i) => state.englishProgress[lesson.date + '#' + i]).length;

      // 下拉：未来课标 🔒 且 disabled（按日期解锁）
      const lessonTabs = lessons.length > 1
        ? `<div class="en-lesson-head">
             <div class="section-title" style="margin:0">🎧 30 天英语体系 · Day ${lesson.day}/30</div>
             <select class="lesson-select" onchange="switchLesson(this.value)">
               ${lessons.map((l, i) => `<option value="${i}" ${i === idx ? 'selected' : ''} ${l.date > today ? 'disabled' : ''}>${l.date > today ? '🔒 ' : ''}Day ${l.day} · ${escapeHtml(l.source || '课')}</option>`).join('')}
             </select>
           </div>`
        : `<div class="section-title">🎧 30 天英语体系 · Day ${lesson.day}/30</div>`;

      // 开场课专属布局
      if (lesson.opening) {
        const o = lesson.opening;
        container.innerHTML = `
          ${lessonTabs}
          <div class="hero-card">
            <div><h2>🎧 30 天日常口语 + 语法体系</h2><p>锚定《新概念英语》第一册前 28 课当语法骨架，每天 1 场景 + 1 语法点，30 天后能开口日常交流。</p></div>
            <div class="hero-stats">

            </div>
          </div>

          <div class="card"><div class="card-body"><p>${escapeHtml(o.overview)}</p></div></div>
          <div class="section-title">🎯 30 天后你能做到</div>

          <div class="section-title">🛠️ 怎么学（每天 10 分钟）</div>
          <div class="card"><div class="card-body"><ul class="en-tips">${o.method.map(m => `<li>${escapeHtml(m)}</li>`).join('')}</ul></div></div>
          <div class="section-title">🗺️ 四周路线图</div>

    // ================== 导出 Excel 备份 ==================
    function exportExcel() {
      const todayStr = new Date().toISOString().slice(0, 10);
      const lu = document.getElementById('lastUpdate');
      const luText = lu ? lu.textContent.trim() : todayStr;
      const luDate = (luText.match(/\d{4}-\d{2}-\d{2}/) || [todayStr])[0];

      // 收集所有日期的联网数据：当前快照 + 历史快照，按日期去重、最新在前
      const snapMap = new Map();
      snapMap.set(luDate, DATA);
      DATA_HISTORY.forEach(h => { if (!snapMap.has(h.date)) snapMap.set(h.date, h.data); });
      const snapshots = [...snapMap.entries()].sort((a, b) => a[0] < b[0] ? 1 : -1);

      // ---- 表1：资讯汇总（每天输出的联网内容）----
      const infoHeaders = ['日期', '类别', '主题/标题', '来源/平台', '热度/标签', '关键内容', '链接'];
      const infoRows = [];
      snapshots.forEach(([date, data]) => {
        (data.aiCodingNews || []).forEach(n => infoRows.push([date, 'AI编程·新闻', n.title, n.source, n.tag || '', n.summary, n.url]));
        (data.aiCodingTopics || []).forEach(t => infoRows.push([date, 'AI编程·选题', t.title, t.type || '', t.heat || '', t.angle || '', t.url]));
        (data.opcNews || []).forEach(n => infoRows.push([date, 'OPC·新闻', n.title, n.source, n.tag || '', n.summary, n.url]));
        (data.opcTopics || []).forEach(t => infoRows.push([date, 'OPC·拆解选题', t.title, t.type || '', t.heat || '', t.angle || '', t.url]));
        (data.novelTracks || []).forEach(n => infoRows.push([date, '小说赛道', n.track, n.platform || '', n.heat || '', (n.tags || []).join('、') + ' ' + (n.tip || ''), '']));
        (data.hotVideos || []).forEach(v => infoRows.push([date, '热点视频', v.title, (v.category || '') + ' ' + (v.source || ''), v.heat || '', (v.why || '') + ' ' + (v.angle || ''), (v.dyUrl || v.biliUrl || '')]));
      });
      if (!infoRows.length) infoRows.push(['', '（暂无联网数据）', '', '', '', '', '']);

      // ---- 表2：复盘记录（你写的）----
      const revHeaders = ['日期', '发布平台', '完成内容', '数据表现/反馈', '做得好/需改进'];
      const revRows = state.reviews.length
        ? state.reviews.map(r => [r.date, r.platform, r.done, r.data, r.reflect])
        : [['（还没有复盘记录）', '', '', '', '']];

      // ---- 表3：我的本地数据（任务/备忘/运动，一并备份）----
      const fmtTs = ts => { try { return new Date(ts).toISOString().slice(0, 10); } catch { return ''; } };
      const locHeaders = ['类型', '日期', '内容', '备注'];
      const locRows = [];
      (state.tasks || []).forEach(t => locRows.push(['任务', fmtTs(t.created), t.text, t.done ? '已完成' : '进行中']));
      (state.notes || []).forEach(n => locRows.push(['备忘', fmtTs(n.date), n.text, '']));
      (state.sports || []).forEach(s => locRows.push(['运动', fmtTs(s.date), s.name, '时长 ' + (s.duration || '') + ' · 消耗 ' + (s.calories || 0) + ' kcal']));
      if (!locRows.length) locRows.push(['（暂无本地记录）', '', '', '']);

      const sheets = [
        { name: '资讯汇总', headers: infoHeaders, rows: infoRows },
        { name: '复盘记录', headers: revHeaders, rows: revRows },
        { name: '我的本地数据', headers: locHeaders, rows: locRows }
      ];

      const html = buildExcelHtml(sheets);
      const blob = new Blob(['﻿' + html], { type: 'application/vnd.ms-excel' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '大发创作备份_' + todayStr + '.xls';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      toast('已导出 Excel 备份（资讯 + 复盘 + 本地数据）');
    }
    function buildExcelHtml(sheets) {
      const cell = v => '<td style="border:1px solid #ccc;padding:4px 8px;vertical-align:top;">' + escapeHtml(v == null ? '' : v) + '</td>';
      const headCell = v => '<td style="border:1px solid #999;background:#f2f2f2;font-weight:bold;padding:4px 8px;">' + escapeHtml(v) + '</td>';
      let body = '';
      sheets.forEach(s => {
        let rows = '<tr>' + s.headers.map(headCell).join('') + '</tr>';
        s.rows.forEach(r => { rows += '<tr>' + r.map(cell).join('') + '</tr>'; });
        body += '<x:ExcelWorksheet><x:Name>' + escapeHtml(s.name) + '</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions><table border="1" cellspacing="0">' + rows + '</table></x:ExcelWorksheet>';
      });
      return '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"></head><body><x:ExcelWorkbook><x:ExcelWorksheets>' + body + '</x:ExcelWorksheets></x:ExcelWorkbook></body></html>';
    }

    // ================== 通用工具函数 ==================
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }
    function escapeJs(str) {
      return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, '\\n');
    }
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }
    function exportData() {
      const payload = {
        tasks: state.tasks, notes: state.notes, sports: state.sports,
        reviews: state.reviews, englishProgress: state.englishProgress,
        exportedAt: new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `dafa-workbench-backup-${new Date().toISOString().slice(0,10)}.json`;
      a.click(); URL.revokeObjectURL(url);
      toast('备份已导出');
    }
    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const data = JSON.parse(e.target.result);
          if (data.tasks) { state.tasks = data.tasks; save(LS_KEYS.tasks, state.tasks); }
          if (data.notes) { state.notes = data.notes; save(LS_KEYS.notes, state.notes); }
          if (data.sports) { state.sports = data.sports; save(LS_KEYS.sports, state.sports); }
          if (data.reviews) { state.reviews = data.reviews; save(LS_KEYS.reviews, state.reviews); }
          if (data.englishProgress) { state.englishProgress = data.englishProgress; save(LS_KEYS.english, state.englishProgress); }
          renderPage();
          toast('备份已导入');
        } catch (err) { toast('导入失败：文件格式不对'); }
      };
      reader.readAsText(file);
      event.target.value = '';
    }
    function showRefreshInfo() {
      alert('「联网刷新」说明：\n\n1. 已创建 WorkBuddy 自动化「大发创作工作台每日数据刷新」，每天 09:00 自动联网搜索热点并更新本页面数据。\n\n2. 当前页面数据来自 2026-08-02 的实时搜索，可直接点击各卡片链接查看原文/原视频。\n\n3. 如需立即更新，可在 WorkBuddy 对话框说：「更新我的工作台数据」。');
    }

    // 启动
    init();
  </script>
</body>
</html>
